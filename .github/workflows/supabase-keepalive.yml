# Keeps the free Supabase project awake. Supabase pauses a free project after about a
# week without activity; this asks the database a tiny question twice a week.
# It uses only the public (publishable) key from model/config.js and looks up a slug
# that does not exist, so it reads nothing and changes nothing.
# Run it by hand: GitHub > Actions > "Supabase keep-alive" > Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database a tiny question
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" model/config.js | head -1)
          key=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" model/config.js | head -1)
          test -n "$url" && test -n "$key"
          code=$(curl -s -o /tmp/out -w '%{http_code}' --retry 3 --retry-delay 20 \
            -X POST "$url/rest/v1/rpc/get_model" \
            -H "apikey: $key" -H 'Content-Type: application/json' \
            -d '{"p_slug":"keepalive0000"}')
          echo "Supabase answered HTTP $code"
          test "$code" = 200
