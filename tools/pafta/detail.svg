     the tower bracing meet it. Hand-written. The main view is drawn in real millimetres inside a scale(0.1) group:
     u to the right from the column axis, y = −v (v up from the bottom chord axis, level +35.00). The view is
     broken between the bottom chord node and the cap: the upper band (v 2710…3560) is shifted down by 2120.
     From the model: top chord axis meets the column axis at v = 3281, slope 9.37 % (5.353°); the end diagonal
     runs from there to the bottom chord 5000 further on (33.27°); inside the tower (to the left, outer chord
     3000 away) the head diagonal comes up from the outer chord at v = 0 into the same point (47.56°), and at the
     bottom node the head diagonal goes up to the outer chord top (45°) and the lacing down to v = −5000 (59.04°).
     Callouts, leaders, weld symbols and dimensions are in sheet millimetres: a point (u, v) of the lower band is
     at (303 + u/10, 157 − v/10), of the upper band at (303 + u/10, 369 − v/10). The groups translate(22 9) and
     translate(22 −3) hold callouts first written for an earlier placement of the view. -->
